[project]
name = "cape-agent-backend"
version = "0.1.0"
description = "Cape Agent backend - FastAPI + CAMEL-AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "camel-ai[all]==0.2.90a6",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
